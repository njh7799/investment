name: Publish investment reports

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update market data]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investment-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest default branch after data commit
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install site dependencies
        run: pnpm --dir site install --frozen-lockfile
      - name: Validate analysis and reporting
        run: python -m pytest --quiet
      - name: Install Korean chart font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Generate public report data
        run: python -m reporting.build
      - name: Check site types
        run: pnpm --dir site check
      - name: Build static site
        run: pnpm --dir site build
      - name: Verify public links and publication boundary
        run: pnpm --dir site verify
      - name: Install browser
        run: pnpm --dir site exec playwright install --with-deps chromium
      - name: Verify browser interactions
        run: pnpm --dir site exec playwright test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reports
        id: deployment
        uses: actions/deploy-pages@v4
