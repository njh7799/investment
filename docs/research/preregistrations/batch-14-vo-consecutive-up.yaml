asset_symbols: {q: QQQ, t: TQQQ}
common_definitions:
  state_machine: "Use corrected batch-13 actual-entry-price, stop, reset, execution, and subperiod rules verbatim."
  consecutive_up: "U(asset,N,t) requires the last N close-to-close returns all strictly positive; unchanged fails."
  cumulative_return: "G(asset,N,t)=close(t)/close(t-N)-1; equality with M passes."
  rearm: "After stop, the streak asset must have a non-positive day; entry then needs a newly completed U condition and, for combos, G threshold."
  combinations: "Run separately; do not add parameters after results."
