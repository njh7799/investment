correction_reason: >-
  The original run latched entries until episode end and did not test the user's actual purchase-price
  stop. Its results are invalid for this question and are replaced using batch 13's corrected state machine.
candidate_objective: "Test consecutive-up rebound entries with an actual next-open fill-price stop."
