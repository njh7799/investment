name: Validate investment reports
description: Install dependencies, run tests, and build the static report site

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
    - uses: pnpm/action-setup@v4
      with:
        version: '11.25.0'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: site/pnpm-lock.yaml
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install --requirement requirements.txt
    - name: Install site dependencies
      shell: bash
      run: pnpm --dir site install --frozen-lockfile
    - name: Validate analysis and reporting
      shell: bash
      run: python -m pytest --quiet
    - name: Install Korean chart font
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
    - name: Generate public report data
      shell: bash
      run: python -m reporting.build
    - name: Check site types
      shell: bash
      run: pnpm --dir site check
    - name: Build static site
      shell: bash
      run: pnpm --dir site build
    - name: Verify public links and publication boundary
      shell: bash
      run: pnpm --dir site verify
    - name: Install browser
      shell: bash
      run: pnpm --dir site exec playwright install --with-deps chromium
    - name: Verify browser interactions
      shell: bash
      run: pnpm --dir site exec playwright test
